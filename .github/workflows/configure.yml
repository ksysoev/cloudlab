name: Configure Server (deprecated)

# ─────────────────────────────────────────────────────────────────────────────
# DEPRECATED — no longer part of the normal deployment pipeline.
#
# Server configuration is now baked into the DigitalOcean snapshot by Packer
# (see packer/) and completed at first boot by cloud-init (see
# terraform/cloud-init.yml.tpl).  The two-step Terraform + Ansible flow has
# been replaced by:
#
#   1. build-image.yml  — Packer builds a pre-configured snapshot
#   2. provision.yml    — Terraform deploys the snapshot; cloud-init finishes
#
# This workflow is kept for:
#   • Ad-hoc drift inspection against a running droplet
#   • Emergency manual re-configuration if needed
#   • Historical reference / rollback capability
#
# It will NOT run automatically.  Trigger manually via workflow_dispatch only.
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "yes" to confirm running the deprecated Ansible configure workflow'
        required: true
        type: string
        default: 'no'

permissions:
  contents: read

env:
  ANSIBLE_WORKING_DIR: './ansible'

jobs:
  configure:
    name: Configure with Ansible (manual / emergency only)
    runs-on: ubuntu-latest
    environment: production

    if: github.event.inputs.confirm == 'yes'

    defaults:
      run:
        working-directory: ${{ env.ANSIBLE_WORKING_DIR }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Ansible and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          ansible-galaxy collection install -r requirements.yml

      - name: Setup Terraform for dynamic inventory
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '1.9.0'
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}
          terraform_wrapper: false

      - name: Initialize Terraform (for inventory)
        run: terraform init
        working-directory: ./terraform

      - name: Wait for droplet SSH
        working-directory: .
        run: |
          DROPLET_IP=$(cd terraform && terraform output -raw droplet_ip)
          SSH_PORT="${{ secrets.SWARM_SSH_PORT || '1923' }}"
          echo "Waiting for SSH on ${DROPLET_IP}:${SSH_PORT}..."
          for i in {1..60}; do
            if nc -z -w 5 "${DROPLET_IP}" "${SSH_PORT}" 2>/dev/null; then
              echo "SSH ready on ${DROPLET_IP}:${SSH_PORT}"
              sleep 5
              exit 0
            fi
            echo "Not ready yet (attempt ${i}/60), retrying in 10s..."
            sleep 10
          done
          echo "SSH did not become available within the expected time."
          exit 1

      - name: Configure SSH key
        working-directory: .
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          DROPLET_IP=$(cd terraform && terraform output -raw droplet_ip)
          ssh-keyscan -p ${{ secrets.SWARM_SSH_PORT || '1923' }} -H "${DROPLET_IP}" \
            >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Derive SSH public key from private key
        working-directory: .
        run: |
          ssh-keygen -y -f ~/.ssh/id_rsa > ~/.ssh/id_rsa.pub
          {
            echo "deployer_ssh_public_key: |"
            sed 's/^/  /' ~/.ssh/id_rsa.pub
          } > /tmp/bootstrap_vars.yml

      - name: Run Ansible playbook
        run: |
          ansible-playbook playbooks/site.yml \
            --skip-tags bootstrap \
            -e "@group_vars/all.yml" \
            -e "ssh_port=${{ secrets.SWARM_SSH_PORT || '1923' }}" \
            -e "@/tmp/bootstrap_vars.yml" \
            -e "grafana_cloud_logs_url=${GRAFANA_CLOUD_LOGS_URL}" \
            -e "grafana_cloud_logs_id=${GRAFANA_CLOUD_LOGS_ID}" \
            -e "grafana_cloud_metrics_url=${GRAFANA_CLOUD_METRICS_URL}" \
            -e "grafana_cloud_metrics_id=${GRAFANA_CLOUD_METRICS_ID}" \
            -e "grafana_cloud_api_key=${GRAFANA_CLOUD_API_KEY}"
        env:
          GRAFANA_CLOUD_LOGS_URL: ${{ secrets.GRAFANA_CLOUD_LOGS_URL }}
          GRAFANA_CLOUD_LOGS_ID: ${{ secrets.GRAFANA_CLOUD_LOGS_ID }}
          GRAFANA_CLOUD_METRICS_URL: ${{ secrets.GRAFANA_CLOUD_METRICS_URL }}
          GRAFANA_CLOUD_METRICS_ID: ${{ secrets.GRAFANA_CLOUD_METRICS_ID }}
          GRAFANA_CLOUD_API_KEY: ${{ secrets.GRAFANA_CLOUD_API_KEY }}
