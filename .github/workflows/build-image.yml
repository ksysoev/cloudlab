name: Build Packer Image

# Builds a new DigitalOcean snapshot whenever packer/ sources change.
# After a successful build the new snapshot ID is written to the
# HCP Terraform workspace variable `cloudlab_image_id` so the next
# terraform apply will deploy the fresh image automatically.

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      do_region:
        description: 'DigitalOcean region for the build droplet'
        required: false
        type: string
        default: 'sgp1'
      dry_run:
        description: 'Validate only — do not build or push a snapshot'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  PACKER_VERSION: '1.11.2'
  PACKER_WORKING_DIR: './packer'

jobs:
  detect-packer-changes:
    name: Detect packer changes
    runs-on: ubuntu-latest
    outputs:
      packer_changed: ${{ steps.detect.outputs.packer_changed }}

    steps:
      - name: Checkout code
        if: github.event_name == 'push'
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect whether packer/ changed in push
        id: detect
        run: |
          PACKER_CHANGED=false

          if [ "${{ github.event_name }}" = "push" ]; then
            BASE_SHA="${{ github.event.before }}"
            HEAD_SHA="${{ github.sha }}"
            CHANGED_FILES=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" || true)

            if echo "$CHANGED_FILES" | grep -q '^packer/'; then
              PACKER_CHANGED=true
            fi
          fi

          echo "packer_changed=${PACKER_CHANGED}" >> "$GITHUB_OUTPUT"

  # ── Validate Packer template ───────────────────────────────────────────────
  validate:
    name: Validate Packer template
    runs-on: ubuntu-latest
    needs: detect-packer-changes
    if: github.event_name == 'workflow_dispatch' || needs.detect-packer-changes.outputs.packer_changed == 'true'
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Packer
        uses: hashicorp/setup-packer@v3
        with:
          version: ${{ env.PACKER_VERSION }}

      - name: Packer Init
        working-directory: ${{ env.PACKER_WORKING_DIR }}
        run: packer init .

      - name: Packer Format Check
        working-directory: ${{ env.PACKER_WORKING_DIR }}
        run: packer fmt -check -recursive .

      - name: Packer Validate
        working-directory: ${{ env.PACKER_WORKING_DIR }}
        env:
          PACKER_VAR_do_token: ${{ secrets.DO_TOKEN }}
        run: packer validate -var "do_token=${{ secrets.DO_TOKEN }}" .

  # ── Build snapshot ─────────────────────────────────────────────────────────
  build:
    name: Build DigitalOcean Snapshot
    runs-on: ubuntu-latest
    needs: validate
    environment: production

    # Only build on push to main or explicit non-dry-run dispatch
    if: |
      (github.event_name == 'push' && needs.detect-packer-changes.outputs.packer_changed == 'true') ||
      (github.event_name == 'workflow_dispatch' && !inputs.dry_run)

    outputs:
      snapshot_id:   ${{ steps.build.outputs.snapshot_id }}
      snapshot_name: ${{ steps.build.outputs.snapshot_name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Packer
        uses: hashicorp/setup-packer@v3
        with:
          version: ${{ env.PACKER_VERSION }}

      - name: Packer Init
        working-directory: ${{ env.PACKER_WORKING_DIR }}
        run: packer init .

      - name: Packer Build
        id: build
        working-directory: ${{ env.PACKER_WORKING_DIR }}
        env:
          PACKER_LOG: 1
          PACKER_LOG_PATH: /tmp/packer.log
        run: |
          DO_REGION="${{ inputs.do_region || 'sgp1' }}"

          packer build \
            -var "do_token=${{ secrets.DO_TOKEN }}" \
            -var "do_region=${DO_REGION}" \
            -machine-readable \
            . | tee /tmp/packer-output.txt

          # Parse snapshot ID from machine-readable output
          SNAPSHOT_ID=$(grep 'artifact,0,id' /tmp/packer-output.txt \
            | cut -d',' -f6 \
            | cut -d':' -f2 \
            | tr -d '[:space:]')

          SNAPSHOT_NAME=$(grep 'artifact,0,string' /tmp/packer-output.txt \
            | cut -d',' -f6 \
            | tr -d '[:space:]')

          if [ -z "$SNAPSHOT_ID" ]; then
            echo "ERROR: Could not parse snapshot ID from Packer output."
            cat /tmp/packer-output.txt
            exit 1
          fi

          echo "snapshot_id=${SNAPSHOT_ID}"   >> "$GITHUB_OUTPUT"
          echo "snapshot_name=${SNAPSHOT_NAME}" >> "$GITHUB_OUTPUT"

          echo "### Packer Build Complete :camera:" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Snapshot ID | \`${SNAPSHOT_ID}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Snapshot Name | \`${SNAPSHOT_NAME}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Region | \`${DO_REGION}\` |" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Packer log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: packer-build-log
          path: /tmp/packer.log
          retention-days: 7

  # ── Update TF Cloud workspace variable ────────────────────────────────────
  update-tf-variable:
    name: Update cloudlab_image_id in HCP Terraform
    runs-on: ubuntu-latest
    needs: build
    environment: production

    steps:
      - name: Find workspace variable ID
        id: find-var
        env:
          TF_API_TOKEN: ${{ secrets.TF_API_TOKEN }}
          TF_WORKSPACE_ID: ${{ secrets.TF_WORKSPACE_ID }}
        run: |
          if [ -z "${TF_API_TOKEN}" ]; then
            echo "ERROR: Missing secret TF_API_TOKEN"
            exit 1
          fi

          if [ -z "${TF_WORKSPACE_ID}" ]; then
            echo "ERROR: Missing secret TF_WORKSPACE_ID"
            echo "Set TF_WORKSPACE_ID in repository/environment secrets."
            exit 1
          fi

          # Fetch all workspace variables and find the cloudlab_image_id var ID
          RESPONSE=$(curl -sS --fail -g \
            -H "Authorization: Bearer ${TF_API_TOKEN}" \
            -H "Content-Type: application/vnd.api+json" \
            "https://app.terraform.io/api/v2/workspaces/${TF_WORKSPACE_ID}/vars?page%5Bsize%5D=100")

          VAR_ID=$(echo "$RESPONSE" | jq -r '
            .data[]
            | select(.attributes.key == "cloudlab_image_id")
            | .id')

          if [ -z "$VAR_ID" ] || [ "$VAR_ID" = "null" ]; then
            echo "ERROR: Variable cloudlab_image_id not found in workspace."
            echo "Create it first in the HCP Terraform workspace UI."
            echo "Response: $RESPONSE"
            exit 1
          fi

          echo "var_id=${VAR_ID}" >> "$GITHUB_OUTPUT"

      - name: Update cloudlab_image_id
        env:
          TF_API_TOKEN: ${{ secrets.TF_API_TOKEN }}
          TF_WORKSPACE_ID: ${{ secrets.TF_WORKSPACE_ID }}
        run: |
          curl -sS --fail \
            -X PATCH \
            -H "Authorization: Bearer ${TF_API_TOKEN}" \
            -H "Content-Type: application/vnd.api+json" \
            "https://app.terraform.io/api/v2/workspaces/${TF_WORKSPACE_ID}/vars/${{ steps.find-var.outputs.var_id }}" \
            -d '{
              "data": {
                "type": "vars",
                "id": "${{ steps.find-var.outputs.var_id }}",
                "attributes": {
                  "value": "${{ needs.build.outputs.snapshot_id }}",
                  "sensitive": false
                }
              }
            }'

          echo "### TF Variable Updated :white_check_mark:" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "\`cloudlab_image_id\` set to \`${{ needs.build.outputs.snapshot_id }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Next step: trigger the **Provision Infrastructure** workflow to deploy the new image." >> "$GITHUB_STEP_SUMMARY"

  # ── Prune old snapshots ────────────────────────────────────────────────────
  prune-snapshots:
    name: Prune old cloudlab snapshots
    runs-on: ubuntu-latest
    needs: [build, update-tf-variable]
    environment: production

    steps:
      - name: Delete old snapshots (keep latest 1)
        env:
          DO_TOKEN: ${{ secrets.DO_TOKEN }}
          NEW_SNAPSHOT_ID: ${{ needs.build.outputs.snapshot_id }}
        run: |
          echo "Fetching all cloudlab snapshots..."
          SNAPSHOTS=$(curl -sS --fail \
            -H "Authorization: Bearer ${DO_TOKEN}" \
            "https://api.digitalocean.com/v2/snapshots?resource_type=droplet&per_page=100" \
            | jq -r '
              .snapshots[]
              | select(.name | startswith("cloudlab-"))
              | "\(.created_at) \(.id)"
            ' | sort -r)

          echo "All cloudlab snapshots (newest first):"
          echo "$SNAPSHOTS"

          # Keep only the most recent snapshot; delete the rest
          OLD_IDS=$(echo "$SNAPSHOTS" | awk 'NR>1 {print $2}')

          if [ -z "$OLD_IDS" ]; then
            echo "No old snapshots to prune."
            exit 0
          fi

          for ID in $OLD_IDS; do
            # Never delete the snapshot we just built
            if [ "$ID" = "${NEW_SNAPSHOT_ID}" ]; then
              echo "Skipping current snapshot ${ID}"
              continue
            fi
            echo "Deleting old snapshot ${ID}..."
            curl -sS --fail \
              -X DELETE \
              -H "Authorization: Bearer ${DO_TOKEN}" \
              "https://api.digitalocean.com/v2/snapshots/${ID}" \
            && echo "Deleted ${ID}" || echo "WARNING: Failed to delete ${ID}"
          done
