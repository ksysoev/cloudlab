name: Provision Infrastructure

# Provisions or updates DigitalOcean infrastructure via Terraform.
# The droplet is deployed from a pre-baked Packer snapshot (cloudlab_image_id).
# All server configuration is handled by cloud-init at first boot — no
# separate Ansible configure step is required.
#
# Trigger order for a full image update:
#   1. build-image.yml  — builds new Packer snapshot, updates cloudlab_image_id
#   2. provision.yml    — terraform apply deploys the new snapshot

on:
  push:
    branches:
      - main
    paths:
      - 'terraform/**'
      - '.github/workflows/provision.yml'
  workflow_run:
    workflows:
      - Build Packer Image
    types:
      - completed
  workflow_dispatch:
    inputs:
      action:
        description: 'Terraform action to perform'
        required: true
        type: choice
        options:
          - plan
          - apply
          - destroy
        default: 'plan'

permissions:
  contents: read

env:
  TF_VERSION: '1.9.0'
  TF_WORKING_DIR: './terraform'

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      packer_changed: ${{ steps.detect.outputs.packer_changed }}

    steps:
      - name: Checkout code
        if: github.event_name == 'push'
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect whether packer/ changed in push
        id: detect
        run: |
          PACKER_CHANGED=false

          if [ "${{ github.event_name }}" = "push" ]; then
            BASE_SHA="${{ github.event.before }}"
            HEAD_SHA="${{ github.sha }}"

            if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
              BASE_SHA="${HEAD_SHA}^"
            fi

            CHANGED_FILES=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" || true)

            if echo "$CHANGED_FILES" | grep -q '^packer/'; then
              PACKER_CHANGED=true
            fi
          fi

          echo "packer_changed=${PACKER_CHANGED}" >> "$GITHUB_OUTPUT"

  terraform:
    name: Terraform ${{ github.event.inputs.action || 'apply' }}
    runs-on: ubuntu-latest
    needs: changes
    if: |
      (github.event_name != 'workflow_run' ||
        (github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.head_branch == 'main' &&
         github.event.workflow_run.event == 'push')) &&
      (github.event_name != 'push' || needs.changes.outputs.packer_changed != 'true')
    environment: production

    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          # HCP Terraform token — all variable values are managed in the
          # workspace so no TF_VAR_* env vars are needed here.
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Init
        id: init
        run: terraform init

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color

      - name: Terraform Plan
        id: plan
        if: github.event.inputs.action == 'plan'
        run: terraform plan -no-color -input=false

      - name: Terraform Apply
        id: apply
        if: |
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
          github.event.inputs.action == 'apply'
        run: terraform apply -auto-approve -input=false

      - name: Verify droplet is reachable via SSH
        if: steps.apply.outcome == 'success'
        run: |
          TF_OUTPUTS=$(terraform output -json)
          DROPLET_IP=$(echo "$TF_OUTPUTS" | jq -r '.droplet_ip.value')
          SSH_PORT=$(echo "$TF_OUTPUTS" | jq -r '.ssh_port.value')
          echo "Waiting for SSH on ${DROPLET_IP}:${SSH_PORT} (cloud-init may still be running)..."
          for i in $(seq 1 30); do
            if nc -z -w 5 "${DROPLET_IP}" "${SSH_PORT}" 2>/dev/null; then
              echo "SSH is reachable on ${DROPLET_IP}:${SSH_PORT}"
              exit 0
            fi
            echo "Attempt ${i}/30 — not ready yet, retrying in 15s..."
            sleep 15
          done
          echo "WARNING: SSH did not become reachable within 7.5 minutes."
          echo "cloud-init may still be running — check droplet console."
          exit 1

      - name: Terraform Destroy
        if: github.event.inputs.action == 'destroy' && github.ref == 'refs/heads/main'
        run: terraform destroy -auto-approve -input=false

      - name: Format failure notice
        if: steps.fmt.outcome == 'failure'
        run: |
          echo "Terraform formatting check failed."
          echo "Run 'terraform fmt -recursive ./terraform' to fix."
          exit 1

      - name: Deployment summary
        if: steps.apply.outcome == 'success'
        run: |
          TF_OUTPUTS=$(terraform output -json)
          DROPLET_NAME=$(echo "$TF_OUTPUTS" | jq -r '.droplet_name.value')
          echo "### Infrastructure Provisioned :white_check_mark:" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Droplet deployed from Packer snapshot \`${DROPLET_NAME}\`." >> "$GITHUB_STEP_SUMMARY"
          echo "cloud-init is configuring Docker Swarm and Grafana Alloy at first boot." >> "$GITHUB_STEP_SUMMARY"
