name: Provision Infrastructure

# Provisions or updates DigitalOcean infrastructure via Terraform.
# The droplet is deployed from a pre-baked Packer snapshot (cloudlab_image_id).
# All server configuration is handled by cloud-init at first boot — no
#
# Trigger order for a full image update:
#   1. build-image.yml  — builds new Packer snapshot, updates cloudlab_image_id
#   2. provision.yml    — terraform apply deploys the new snapshot

on:
  workflow_run:
    workflows:
      - Build Packer Image
    types:
      - completed
  workflow_dispatch:
    inputs:
      action:
        description: 'Terraform action to perform'
        required: true
        type: choice
        options:
          - plan
          - apply
          - destroy
        default: 'plan'

permissions:
  contents: read

env:
  TF_VERSION: '1.9.0'
  TF_WORKING_DIR: './terraform'

jobs:
  terraform:
    name: Terraform ${{ github.event.inputs.action || 'apply' }}
    runs-on: ubuntu-latest
    if: |
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    environment: production

    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Show deployment commit
        run: |
          echo "Deploying commit: $(git rev-parse HEAD)"
          echo "### Deployment Commit" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$(git rev-parse HEAD)\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          # HCP Terraform token — all variable values are managed in the
          # workspace so no TF_VAR_* env vars are needed here.
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Init
        id: init
        run: terraform init

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color

      - name: Terraform Plan
        id: plan
        if: github.event.inputs.action == 'plan'
        run: terraform plan -no-color -input=false

      - name: Terraform Apply
        id: apply
        if: |
          (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
          github.event.inputs.action == 'apply'
        run: terraform apply -auto-approve -input=false

      - name: Verify droplet is reachable via SSH
        if: steps.apply.outcome == 'success'
        run: |
          TF_OUTPUTS=$(terraform output -json)
          DROPLET_IP=$(echo "$TF_OUTPUTS" | jq -r '.droplet_ip.value')
          SSH_PORT=$(echo "$TF_OUTPUTS" | jq -r '.ssh_port.value')
          SSH_USER="deployer"
          echo "Waiting for SSH on ${DROPLET_IP}:${SSH_PORT}..."
          for i in $(seq 1 30); do
            if nc -z -w 5 "${DROPLET_IP}" "${SSH_PORT}" 2>/dev/null; then
              echo "SSH port is open on ${DROPLET_IP}:${SSH_PORT}"
              break
            fi
            echo "Attempt ${i}/30 — not ready yet, retrying in 15s..."
            sleep 15
            if [ "$i" -eq 30 ]; then
              echo "ERROR: SSH did not become reachable within 7.5 minutes."
              exit 1
            fi
          done
          echo "Waiting for cloud-init to complete (docker swarm init runs inside cloud-init)..."
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOYER_SSH_PRIVATE_KEY }}" > ~/.ssh/ci_key
          chmod 600 ~/.ssh/ci_key
          for i in $(seq 1 40); do
            STATUS=$(ssh -i ~/.ssh/ci_key \
              -p "${SSH_PORT}" \
              -o StrictHostKeyChecking=no \
              -o ConnectTimeout=10 \
              "${SSH_USER}@${DROPLET_IP}" \
              "cloud-init status 2>/dev/null || echo 'unknown'" 2>/dev/null || echo 'ssh-error')
            echo "Attempt ${i}/40 — cloud-init status: ${STATUS}"
            if echo "$STATUS" | grep -q 'done'; then
              echo "cloud-init completed successfully."
              # Verify swarm is active
              SWARM=$(ssh -i ~/.ssh/ci_key \
                -p "${SSH_PORT}" \
                -o StrictHostKeyChecking=no \
                "${SSH_USER}@${DROPLET_IP}" \
                "docker info --format '{{.Swarm.LocalNodeState}}' 2>/dev/null || echo unknown" 2>/dev/null || echo unknown)
              if [ "$SWARM" = "active" ]; then
                echo "Docker Swarm is active. Provisioning complete."
                rm -f ~/.ssh/ci_key
                exit 0
              else
                echo "ERROR: cloud-init done but Docker Swarm state is '${SWARM}' (expected 'active')."
                echo "Check cloud-init logs: ssh to the droplet and run: sudo cat /var/log/cloud-init-output.log"
                rm -f ~/.ssh/ci_key
                exit 1
              fi
            elif echo "$STATUS" | grep -qE 'error|degraded'; then
              echo "ERROR: cloud-init reported failure: ${STATUS}"
              rm -f ~/.ssh/ci_key
              exit 1
            fi
            sleep 15
          done
          echo "ERROR: cloud-init did not complete within 10 minutes."
          rm -f ~/.ssh/ci_key
          exit 1

      - name: Terraform Destroy
        if: github.event.inputs.action == 'destroy' && github.ref == 'refs/heads/main'
        run: terraform destroy -auto-approve -input=false

      - name: Format failure notice
        if: steps.fmt.outcome == 'failure'
        run: |
          echo "Terraform formatting check failed."
          echo "Run 'terraform fmt -recursive ./terraform' to fix."
          exit 1

      - name: Deployment summary
        if: steps.apply.outcome == 'success'
        run: |
          TF_OUTPUTS=$(terraform output -json)
          DROPLET_NAME=$(echo "$TF_OUTPUTS" | jq -r '.droplet_name.value')
          echo "### Infrastructure Provisioned :white_check_mark:" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Droplet deployed from Packer snapshot \`${DROPLET_NAME}\`." >> "$GITHUB_STEP_SUMMARY"
          echo "cloud-init is configuring Docker Swarm and Grafana Alloy at first boot." >> "$GITHUB_STEP_SUMMARY"
